name: CI/CD to Azure Container Apps

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  RG: cicd-rg
  APP: cicd-demo
  ENVNAME: cicd-env

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.ACR_NAME }}.azurecr.io/cicd-demo:${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build Docker image
        run: docker build -t $IMAGE .

      - name: Security scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Log in to Azure Container Registry
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_NAME }}.azurecr.io -u ${{ secrets.ACR_USERNAME }} --password-stdin

      - name: Push image
        run: docker push $IMAGE

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        run: |
          if az containerapp show -n $APP -g $RG > /dev/null 2>&1; then
            az containerapp update -n $APP -g $RG --image $IMAGE --set-env-vars COMMIT_SHA=${{ github.sha }}
          else
            az containerapp create -n $APP -g $RG --environment $ENVNAME \
              --image $IMAGE --target-port 8080 --ingress external \
              --registry-server ${{ secrets.ACR_NAME }}.azurecr.io \
              --registry-username ${{ secrets.ACR_USERNAME }} \
              --registry-password ${{ secrets.ACR_PASSWORD }} \
              --env-vars COMMIT_SHA=${{ github.sha }}
          fi